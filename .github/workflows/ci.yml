name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # SIGPROF is POSIX-only; the profiler raises a clear error on Windows
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --extra dev
      - run: uv run pytest -q
