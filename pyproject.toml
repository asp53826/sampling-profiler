[project]
name = "sampling-profiler"
version = "0.1.0"
description = "A SIGPROF sampling profiler scored against workloads with known CPU shares"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs a few seconds of CPU"]
